name: classical_ly
description: A repertoire and performance journal for classical musicians.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  crypto: ^3.0.6
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
